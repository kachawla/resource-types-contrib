# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Notify Radius

# Fires a `repository_dispatch` event to radius-project/radius whenever the
# default contrib resource type manifests change on `main`. The Radius repo
# responds by opening a PR that runs `make update-resource-types`, which
# refreshes the manifest copies committed under
# `deploy/manifest/built-in-providers/`. Merging that PR republishes the
# unified `radius` Bicep extension at `br:biceptypes.azurecr.io/radius:latest`.
#
# See the design note in the radius repo:
#   eng/design-notes/extensibility/2026-05-unified-bicep-extension-publishing.md

on:
  push:
    branches:
      - main
    paths:
      # Only fire when files that ship in the unified `radius` Bicep extension
      # change. Recipes and other resources are out of scope.
      - "Compute/**/*.yaml"
      - "Compute/**/*.yml"
      - "Data/**/*.yaml"
      - "Data/**/*.yml"
      - "Security/**/*.yaml"
      - "Security/**/*.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: notify-radius
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch resource-types-contrib-updated
    if: github.repository == 'radius-project/resource-types-contrib'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send repository_dispatch to radius-project/radius
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.GH_RAD_CI_BOT_PAT }}
          repository: radius-project/radius
          event-type: resource-types-contrib-updated
          client-payload: |
            {
              "contrib_ref": "${{ github.sha }}",
              "contrib_repo": "${{ github.repository }}",
              "actor": "${{ github.actor }}"
            }

      - name: Summarize
        run: |
          {
            echo "## Notified radius-project/radius"
            echo "* Event: \`resource-types-contrib-updated\`"
            echo "* Commit: \`${{ github.sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
